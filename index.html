--accent);font-weight:700}.hint{position:absolute;bottom:8px;right:max(16px,env(safe-area-inset-right,0px));font-size:11px;color:var(--muted);pointer-events:none}.panel{flex:0 0 auto;background:var(--surface);border-top:1px solid var(--line);padding-block:12px 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}.readouts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.ro{display:flex;flex-direction:column;gap:2px;min-width:0}.ro span{font-size:11px;color:var(--muted);letter-spacing:.04em}.ro b{font-family:var(--font-data);font-size:18px;font-variant-numeric:tabular-nums;font-weight:700}.ro b small{font-size:11px;color:var(--muted);font-weight:500;margin-left:2px}.row{display:flex;gap:12px;align-items:stretch}#ollie{flex:0 0 auto;font-family:var(--font-display);font-size:18px;padding:0 22px;border-radius:12px;border:none;background:var(--accent);color:var(--accent-fg);cursor:pointer;min-height:64px}#ollie{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;touch-action:none;user-select:none;-webkit-user-select:none}#ollie small{font-family:var(--font-body);font-size:11px;font-weight:500;opacity:.85}#ollie:active{transform:translateY(1px)}#ollie:disabled{opacity:.5;cursor:default}.sliders{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;justify-content:center}.sl{display:grid;grid-template-columns:5.5em minmax(0,1fr) 3em;align-items:center;gap:8px;font-size:12px}.sl input{width:100%;min-width:0;accent-color:var(--accent)}.sl output{font-family:var(--font-data);font-variant-numeric:tabular-nums;text-align:right}.tricks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.tricks button{font-family:var(--font-display);font-size:13px;padding:10px 6px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;touch-action:manipulation;user-select:none;-webkit-user-select:none;white-space:nowrap;min-width:0}.tricks button:active{border-color:var(--push);color:var(--push)}.tricks kbd{font-family:var(--font-data);font-size:12px;color:var(--muted)}.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.tools button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:6px 10px;cursor:pointer}.tools button[aria-pressed=true]{border-color:var(--accent);color:var(--accent);font-weight:700}.tools .sp{flex:1}.tools kbd{font-family:var(--font-data);font-size:11px;color:var(--muted)}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}@media(max-width:440px){.ro b{font-size:15px}#ollie{padding:0 14px;font-size:15px}.sl{grid-template-columns:4.8em minmax(0,1fr) 2.6em}.tools kbd,.tricks kbd{display:none}.tricks button{font-size:11px}.panel{gap:10px}}</style>
</head>
<body>
  <div class="stage" id="stage">
    <canvas id="c" aria-label="滑板 Ollie 物理模擬，可拖曳旋轉視角"></canvas>
    <div class="hud">
      <div><div class="title">Ollie</div><div class="sub" id="sub">物理板子 · IK 人物</div></div>
      <div class="phase" id="phase">滑行</div>
    </div>
    <div class="result" id="result" data-k="good"></div>
    <div id="labels"></div>
    <div class="next" id="next"></div>
    <div class="hint">拖曳旋轉 · 雙指縮放</div>
    <div class="joy" id="joy" hidden aria-label="搖桿：左右轉向，往上推，往下煞車"><div class="knob"></div></div>
  </div>

  <div class="panel">
    <div class="readouts" aria-live="polite">
      <div class="ro"><span>最高高度</span><b id="rH">—<small>cm</small></b></div>
      <div class="ro"><span>滯空時間</span><b id="rA">—<small>s</small></b></div>
      <div class="ro"><span>落地角度</span><b id="rP">—<small>°</small></b></div>
      <div class="ro"><span>板子角度</span><b id="rLive">0<small>°</small></b></div>
    </div>
    <div class="row">
      <button id="ollie" type="button">OLLIE<small>按住＝帶平</small></button>
      <div class="sliders">
        <label class="sl" for="pop"><span>彈板力道</span><input id="pop" type="range" min="0.6" max="1.4" step="0.05" value="1"><output id="popV">1.00</output></label>
        <label class="sl" for="level"><span>前腳帶平</span><input id="level" type="range" min="0" max="2" step="0.1" value="1"><output id="levelV">1.0</output></label>
      </div>
    </div>
    <div class="tricks" aria-label="空中招式">
      <button type="button" data-trick="kickflip"><kbd>←</kbd>Kickflip</button>
      <button type="button" data-trick="heelflip"><kbd>→</kbd>Heelflip</button>
      <button type="button" data-trick="shoveit"><kbd>↓</kbd>Shove-it</button>
    </div>
    <div class="tools">
      <button type="button" id="slow" aria-pressed="false">慢動作 0.25×</button>
      <button type="button" id="arrows" aria-pressed="true">施力箭頭</button>
      <button type="button" id="reset">回到起點</button>
      <button type="button" id="mode" class="mode">自由滑</button>
      <span class="sp"></span>
      <kbd id="keys">空白 Ollie · ← → ↓ 招式 · 按住不放 = 帶平 / 接板</kbd>
    </div>
  </div>
</body>
</html>
